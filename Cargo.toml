[package]
name = "pdf-reader-cp"
version = "2.0.0"
edition = "2021"
description = "PDF Reader CP - lettore PDF opensource con stampa rapida"

[[bin]]
name = "PDFReaderCP"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
pdfium-render = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
printers = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Printing"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
